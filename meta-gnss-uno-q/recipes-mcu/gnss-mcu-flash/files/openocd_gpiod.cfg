# OpenOCD adapter configuration for the Arduino UNO Q: the QRB2210 drives the
# STM32U585's SWD port through three GPIO lines.
#
# Line numbers as published by Arduino for this board (meta-arduino,
# meta-arduino-qcom/recipes-devtools/openocd/files/imola/openocd_gpiod.cfg).
# PENDING HARDWARE TEST on this image: confirm the chip index with `gpiodetect`.

adapter driver linuxgpiod

adapter gpio srst 38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1

transport select swd
source [find target/stm32u5x.cfg]
