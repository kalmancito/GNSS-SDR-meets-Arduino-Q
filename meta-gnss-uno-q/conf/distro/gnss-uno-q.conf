# Minimal distribution for a headless GNSS receiver.
#
# Used instead of Qualcomm's qcom-distro, which brings in about ten more layers
# (virtualization, SELinux, GNOME/XFCE, OTA updates...) that a receiver does not
# need. Everything not set here comes from OE-Core's defaults.

DISTRO = "gnss-uno-q"
DISTRO_NAME = "GNSS-SDR receiver for Arduino UNO Q"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "wrynose"

INIT_MANAGER = "systemd"

# efi, pam and pni-names are what the BSP's own CI enables. polkit lets the
# web monitor start/stop gnss-sdr.service without being root.
DISTRO_FEATURES:append = " efi pam pni-names polkit"
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan 3g nfc pcmcia"

# NetworkManager is the only network manager in the image (nmcli for Wi-Fi).
PACKAGECONFIG:remove:pn-systemd = "networkd"

# Armadillo links against LAPACK, and meta-oe's lapack recipe needs gfortran.
FORTRAN:forcevariable = ",fortran"

PACKAGE_CLASSES ?= "package_ipk"

# Licence compliance: SBOM for every build, and the licence texts of what is
# installed are shipped inside the image.
INHERIT += "create-spdx"
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"
