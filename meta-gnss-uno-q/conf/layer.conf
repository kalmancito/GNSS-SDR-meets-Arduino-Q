# Product layer: GNSS-SDR receiver for the Arduino UNO Q.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "gnss-uno-q"
BBFILE_PATTERN_gnss-uno-q = "^${LAYERDIR}/"
BBFILE_PRIORITY_gnss-uno-q = "10"
LAYERVERSION_gnss-uno-q = "1"

# The only release this layer is built and tested against. Do not widen it to
# silence a compatibility error: it has to be demonstrated by a build.
LAYERSERIES_COMPAT_gnss-uno-q = "wrynose"

LAYERDEPENDS_gnss-uno-q = "core qcom qcom-arduino openembedded-layer meta-python networking-layer sdr-layer"

# Root of this repository. The applications packaged by the layer live in
# apps/ next to it, so the recipes take their sources from there.
# Immediate expansion (:=) is required: LAYERDIR only has this layer's value
# while this file is being parsed.
GNSS_UNO_Q_REPO := "${@os.path.abspath(os.path.join(d.getVar('LAYERDIR'), '..'))}"
