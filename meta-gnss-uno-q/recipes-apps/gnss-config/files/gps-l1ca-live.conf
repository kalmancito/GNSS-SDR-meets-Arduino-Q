; @title GPS L1 C/A - live RTL-SDR (rtl_tcp)
;
; GNSS-SDR profile for the Arduino UNO Q image: GPS L1 C/A in real time from
; an RTL-SDR dongle served by rtl_tcp on the loopback interface
; (rtl-tcp.service). No gr-osmosdr needed.
;
; Derived from conf/RealTime_input/gnss-sdr_GPS_L1_rtl_tcp_realtime.conf of
; GNSS-SDR v0.0.22 (commit 3fcb502a). Differences from that example:
;   - parameters the pinned release no longer reads were dropped or renamed
;     (SignalSource.swap_iq -> flip_iq, Acquisition_1C.doppler_min,
;     Tracking_1C.order);
;   - the IF of 80558 Hz was a calibration of the authors' dongle: set to 0;
;   - standard PCPS acquisition, 7 channels, single-point positioning;
;   - protobuf monitor streams for the web monitor.
; Every name below is checked against the pinned source by tests/test-configs.sh.
;
; NOT YET VALIDATED ON HARDWARE with this image. The antenna must be an active
; GNSS antenna powered through a bias tee (see docs/rf-frontends.md).
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2020 (see the GNSS-SDR AUTHORS file)

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
; Sampling frequency after the signal conditioner [samples per second].
; RTL-SDR oscillators are off by tens of ppm unless they have a TCXO: for best
; results put the calibrated rate here (front-end-cal).
GNSS-SDR.internal_fs_sps=1200000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=RtlTcp_Signal_Source
SignalSource.address=127.0.0.1
SignalSource.port=1234
SignalSource.sampling_frequency=1200000
SignalSource.freq=1575420000
SignalSource.gain=40
SignalSource.rf_gain=40
SignalSource.if_gain=30
SignalSource.AGC_enabled=false
SignalSource.flip_iq=false
SignalSource.samples=0
SignalSource.dump=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Pass_Through

; Low-pass around the carrier; also removes the dongle's DC spike if IF != 0.
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.45
InputFilter.band2_begin=0.55
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=1200000
; Frequency offset of the front-end [Hz], shifted down to zero.
InputFilter.IF=0
InputFilter.dump=false

Resampler.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
; 7 channels is what ran in real time on this board with the Debian build.
Channels_1C.count=7
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=500
Acquisition_1C.max_dwells=15
Acquisition_1C.blocking=false
Acquisition_1C.dump=false

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.dump=false

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=false

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
; Outputs: RINEX and NMEA are kept; the rest is off to spare the eMMC.
PVT.output_path=/var/lib/gnss-sdr/output
PVT.rinex_output_enabled=true
PVT.nmea_output_file_enabled=true
PVT.kml_output_enabled=false
PVT.gpx_output_enabled=false
PVT.geojson_output_enabled=false
PVT.xml_output_enabled=false
PVT.rtcm_output_file_enabled=false
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.dump=false
; PVT stream for the web monitor (protobuf over UDP, loopback only).
PVT.enable_monitor=true
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111
PVT.enable_protobuf=true

;######### MONITOR CONFIG ############
; Per-channel observables for the web monitor. One datagram every
; decimation_factor observable epochs (20 ms each): 10 -> 5 Hz.
Monitor.enable_monitor=true
Monitor.decimation_factor=10
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
Monitor.enable_protobuf=true
