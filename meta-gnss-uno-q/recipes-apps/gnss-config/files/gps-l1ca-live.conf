; @title GPS L1 C/A - live RTL-SDR (rtl_tcp)
;
; GNSS-SDR profile for the Arduino UNO Q image: GPS L1 C/A in real time from
; an RTL-SDR dongle served by rtl_tcp on the loopback interface
; (rtl-tcp.service). No gr-osmosdr needed.
;
; Signal-processing values are those of the configuration validated in real
; time on this board with the factory Debian system
; (docs/logs/board-inventory-20261115/gnss-sdr-conf/RealTime_input/
; all_bands_rtl_realtime.conf, GNSS-SDR 0.0.20, Nooelec NESDR SMArTee):
; 2.048 MS/s, 7 channels, 4 ms coherent integration in acquisition and
; tracking, narrow loops after lock, no ionosphere/troposphere model.
;
; Differences from that file:
;   - source: RtlTcp_Signal_Source instead of Osmosdr_Signal_Source
;     (same rate and gains; see docs/decisions/ADR-003-signal-sources.md);
;   - GPS L1 C/A only: the blocks of the other signals, all with 0 channels,
;     and the OSNMA/telecommand settings were dropped;
;   - parameters GNSS-SDR v0.0.22 no longer reads were dropped
;     (Acquisition_1C.use_CFAR_algorithm, Acquisition_1C.doppler_min);
;   - PVT.display_rate_ms 100 -> 500 (console only: fewer journal writes).
; Every name below is checked against the pinned source by tests/test-configs.sh.
;
; NOT YET RUN with this image. The antenna must be an active GNSS antenna
; powered through a bias tee (see docs/rf-frontends.md).
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2020 (see the GNSS-SDR AUTHORS file)

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
; No resampling: the receiver works at the front-end rate.
; Dongles without a TCXO: put the calibrated rate here (front-end-cal).
GNSS-SDR.internal_fs_sps=2048000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=RtlTcp_Signal_Source
SignalSource.address=127.0.0.1
SignalSource.port=1234
SignalSource.sampling_frequency=2048000
SignalSource.freq=1575420000
SignalSource.gain=40
SignalSource.rf_gain=40
SignalSource.if_gain=30
SignalSource.AGC_enabled=false
SignalSource.flip_iq=false
SignalSource.samples=0
SignalSource.dump=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
Resampler.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
; 7 channels ran in real time on this board (factory system, osmosdr source).
Channels_1C.count=7
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=4
Acquisition_1C.pfa=0.0001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=500
Acquisition_1C.blocking=false
Acquisition_1C.dump=false

;######### TRACKING GLOBAL CONFIG ############
; Wide loops for pull-in, then 4 ms integration with narrow loops.
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=1.5
Tracking_1C.pll_bw_narrow_hz=2.5
Tracking_1C.dll_bw_narrow_hz=0.5
Tracking_1C.extend_correlation_symbols=4
Tracking_1C.dll_filter_order=2
Tracking_1C.pll_filter_order=3
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.1
Tracking_1C.dump=false

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.enable_carrier_smoothing=false
Observables.dump=false

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
; As validated. Broadcast / Saastamoinen would improve accuracy at no real CPU cost.
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.enable_rx_clock_correction=false
PVT.enable_pvt_kf=false
PVT.elevation_mask=5
PVT.output_rate_ms=100
PVT.display_rate_ms=500
; No files: a live receiver runs for days and the eMMC is small. The web
; monitor shows the solution; enable RINEX/NMEA here when they are wanted.
PVT.output_path=/var/lib/gnss-sdr/output
PVT.rinex_output_enabled=false
PVT.nmea_output_file_enabled=false
PVT.kml_output_enabled=false
PVT.gpx_output_enabled=false
PVT.geojson_output_enabled=false
PVT.xml_output_enabled=false
PVT.rtcm_output_file_enabled=false
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.dump=false
PVT.dump_mat=false
; PVT stream for the web monitor (protobuf over UDP, loopback only).
PVT.enable_monitor=true
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111
PVT.enable_protobuf=true

;######### MONITOR CONFIG ############
; Per-channel observables for the web monitor, as validated: one datagram
; every 50 observable epochs.
Monitor.enable_monitor=true
Monitor.decimation_factor=50
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
Monitor.enable_protobuf=true
