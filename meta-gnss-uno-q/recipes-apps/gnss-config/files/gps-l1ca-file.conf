; @title GPS L1 C/A - recorded I/Q file (CTTC 2013 test capture)
;
; GNSS-SDR profile for the Arduino UNO Q image: GPS L1 C/A from a recorded file.
;
; Derived from conf/File_input/GPS/gnss-sdr_GPS_L1_ishort.conf of GNSS-SDR
; v0.0.22 (commit 3fcb502a). Differences from that example:
;   - parameters the pinned release no longer reads were dropped
;     (ControlThread.wait_for_flowgraph, Tracking_1C.order);
;   - observation date, single-point positioning, outputs under /var/lib;
;   - protobuf monitor streams for the web monitor.
; Every name below is checked against the pinned source by tests/test-configs.sh.
;
; The values describe ONE capture format: 16-bit interleaved I/Q, baseband,
; centred on 1575.42 MHz, 4 MS/s. For a different recording change item_type,
; sampling_frequency, the resampler and observation_date together.
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2020 (see the GNSS-SDR AUTHORS file)

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
; Sampling frequency after the signal conditioner [samples per second].
GNSS-SDR.internal_fs_sps=2000000
; Date of the recording: resolves the 1024-week GPS rollover when replaying a
; file. Without it the era is taken from the system clock.
GNSS-SDR.observation_date=2013-04-04

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
; Overridden by GNSS_SDR_SIGNAL_FILE in /etc/default/gnss-sdr (--signal_source).
SignalSource.filename=/var/lib/gnss-sdr/captures/2013_04_04_GNSS_SIGNAL_at_CTTC_SPAIN.dat
SignalSource.item_type=ishort
SignalSource.sampling_frequency=4000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
; false = process as fast as the CPU allows (benchmark). true = play at the
; recorded rate, as a live signal would arrive.
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Ishort_To_Complex

InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex

Resampler.implementation=Direct_Resampler
Resampler.sample_freq_in=4000000
Resampler.sample_freq_out=2000000
Resampler.item_type=gr_complex

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Acquisition_1C.blocking=false
Acquisition_1C.dump=false

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0
Tracking_1C.dump=false

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=false

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
; Outputs: RINEX and NMEA are kept; the rest is off to spare the eMMC.
PVT.output_path=/var/lib/gnss-sdr/output
PVT.rinex_output_enabled=true
PVT.nmea_output_file_enabled=true
PVT.kml_output_enabled=false
PVT.gpx_output_enabled=false
PVT.geojson_output_enabled=false
PVT.xml_output_enabled=false
PVT.rtcm_output_file_enabled=false
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.dump=false
; PVT stream for the web monitor (protobuf over UDP, loopback only).
PVT.enable_monitor=true
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111
PVT.enable_protobuf=true

;######### MONITOR CONFIG ############
; Per-channel observables for the web monitor. One datagram every
; decimation_factor observable epochs (20 ms each): 10 -> 5 Hz.
Monitor.enable_monitor=true
Monitor.decimation_factor=10
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
Monitor.enable_protobuf=true
