# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Base BSP build for the Arduino UNO Q (Qualcomm QRB2210), without the product
# layer. It reproduces what Qualcomm's own CI builds for this board
# (meta-qcom-arduino ci/uno-q.yml), with one difference: every repository is
# pinned to a commit here instead of following a branch.
#
# Baseline: Yocto 6.0 "wrynose" (LTS), Qualcomm Linux 2.x,
#           meta-qcom-arduino tag qli-2.1.1-arduino-rc1.
#
# The pins and the local.conf fragments mirror, at those exact commits:
#   meta-qcom-arduino  ci/base.yml + ci/base.lock.yml
#   meta-qcom          ci/base.yml + ci/base.lock.yml
# See docs/research.md for how they were obtained and manifests/revisions.lock.
#
#   kas-container build kas/uno-q-upstream.yml

header:
  version: 14

machine: uno-q
distro: nodistro

target:
  - core-image-base

repos:
  meta-qcom-arduino:
    url: https://github.com/qualcomm-linux/meta-qcom-arduino
    branch: wrynose
    commit: 583c6e4b496d9c1a0531c98c69eae971a2c71623

  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
    branch: wrynose
    commit: a6c92fad47164e6f051ab5d90567bc92afa661ae

  oe-core:
    url: https://github.com/openembedded/openembedded-core
    branch: wrynose
    commit: ae5a301091f5b0574ea7444aab40b309b6d9f3f2
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    branch: "2.18"
    commit: dc2bb660a85e2e76ae4ce6e02baae73b28f0593d
    layers:
      .: disabled

  # meta-qcom (wrynose) depends on the linux-firmware LTS mixin, with one
  # backport that meta-qcom itself carries and applies through kas.
  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware
    commit: d0fd372d1da9cacca04585f7a1b088fdfb32b77e
    patches:
      shikra-wlanmdsp-fix:
        repo: meta-qcom
        path: patches/linux-firmware-mixin/0001-linux-firmware-backport-ath10k-shikra-wlanmdsp-fix.patch

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "buildstats-summary"
    INHERIT += "buildhistory"
    INHERIT += "rm_work"
    INHERIT += "image-buildinfo"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
  clo-mirrors: |
    MIRRORS:append = " \
    git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
    git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
    https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
    "
  cmdline: |
    KERNEL_CMDLINE_EXTRA:append = " qcom_scm.download_mode=1"
  # The "extra" fragment is what Qualcomm's CI uses for bring-up images: root
  # logs in without a password. The product manifest replaces this fragment.
  extra: |
    DISTRO_FEATURES:append = " efi pam pni-names"
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
    IMAGE_ROOTFS_EXTRA_SPACE = "307200"
    WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
  os-release: |
    OS_RELEASE_FIELDS:append = " BUILD_ID"
    BUILD_ID ?= "local-${DATETIME}"
