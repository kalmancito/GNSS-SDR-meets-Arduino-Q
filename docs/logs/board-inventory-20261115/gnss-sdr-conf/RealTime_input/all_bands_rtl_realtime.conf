;######### TELEMETRY DECODER CONFIG FOR GALILEO E5a CHANNELS ############
TelemetryDecoder_5X.implementation=Galileo_E5a_Telemetry_Decoder
TelemetryDecoder_5X.dump=false

;######### TELEMETRY DECODER CONFIG FOR GALILEO E5b CHANNELS ############
