[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
;internal_fs_sps: Internal signal sampling frequency after the signal conditioning stage [samples per second].
;FOR USE GNSS-SDR WITH RTLSDR DONGLES USER MUST SET THE CALIBRATED SAMPLE RATE HERE
; i.e. using front-end-cal as reported here: https://www.researchgate.net/publication/257137427_Turning_a_Television_into_a_GNSS_Receiver
GNSS-SDR.internal_fs_sps=2048000
;GNSS-SDR.use_acquisition_resampler=true

;GNSS-SDR.telecommand_enabled=true
;GNSS-SDR.telecommand_tcp_port=3333

GNSS-SDR.osnma_enable=false
GNSS-SDR.osnma_public_key=/home/miguel/JAMMERTEST_25/gnss-sdr-jammertest/conf/OSNMA_PublicKey_20240115100000_newPKID_1.crt
GNSS-SDR.osnma_merkletree=/home/miguel/JAMMERTEST_25/gnss-sdr-jammertest/conf/OSNMA_MerkleTree_20240115100000_newPKID_1.xml
GNSS-SDR.osnma_mode=strict
GNSS-SDR.AGNSS_XML_enabled=false

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=Osmosdr_Signal_Source
SignalSource.item_type=gr_complex
; FOR USE GNSS-SDR WITH RTLSDR DONGLES USER MUST SET THE CALIBRATED SAMPLE RATE HERE
; i.e. using front-end-cal as reported here: https://www.researchgate.net/publication/257137427_Turning_a_Television_into_a_GNSS_Receiver
SignalSource.sampling_frequency=2048000
SignalSource.freq=1575420000
SignalSource.gain=40
SignalSource.rf_gain=40
SignalSource.if_gain=30
SignalSource.AGC_enabled = false
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.dump_filename=jammer_test_spoofing_moving.dat


;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter.implementation=Pass_Through

;######### RESAMPLER CONFIG ############
Resampler.implementation=Pass_Through

;###########################################
;######### CHANNELS CONFIG #################
;###########################################

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=7
Channels_1B.count=0
Channels_E6.count=0
Channels_2S.count=0
Channels_L5.count=0
Channels.in_acquisition=1


;#signal SELECTION:
;# "1C" GPS L1 C/A
;# "1B" GALILEO E1 B (I/NAV OS/CS/SoL)
;# "1G" GLONASS L1 C/A
;# "2S" GPS L2 L2C (M)
;# "5X" GALILEO E5a I+Q
;# "L5" GPS L5


;###########################################
;######### CHANNELS CONFIG: ACQUISITION ####
;###########################################

;###########################################
;##### CHANNELS CONFIG: GPS ACQUISITION ####
;###########################################

;######### ACQUISITION FOR GPS L1 C/A CHANNELS ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
;Acquisition_1C.threshold=2.0
Acquisition_1C.use_CFAR_algorithm=false
Acquisition_1C.blocking=false
Acquisition_1C.coherent_integration_time_ms=4
Acquisition_1C.pfa=0.0001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_min=-5000
Acquisition_1C.doppler_step=500
Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./acq_dump.dat

;######### ACQUISITION CONFIG FOR GPS L1 CHANNELS ############
;Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition_Fine_Doppler
;Acquisition_1C.threshold=0.007
;Acquisition_1C.doppler_max=5000
;Acquisition_1C.doppler_min=-5000
;Acquisition_1C.doppler_step=500
;Acquisition_1C.max_dwells=10

;######### ACQUISITION CONFIG FOR GPS L1 CHANNELS ############
;Acquisition_1C.implementation=GPS_L1_CA_PCPS_Tong_Acquisition
